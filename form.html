<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kolhapur Kult — User Authentication (Login & Signup)">
    <title>Login & Signup — Kolhapur Kult</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f1115 0%, #1a1616 50%, #2a1111 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .back-nav {
            position: absolute;
            top: 24px;
            left: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 160, 23, 0.4);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #d4a017;
            color: #1a1100;
            transform: translateX(-3px);
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(26, 29, 36, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 160, 23, 0.35);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(212, 160, 23, 0.1);
            text-align: center;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #d4a017, #8a1414);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 8px 16px rgba(212, 160, 23, 0.3);
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 28px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #d4a017;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 17, 21, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #d4a017;
            box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.2);
            background: rgba(15, 17, 21, 0.95);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        #signup {
            background: linear-gradient(135deg, #8a1414, #c22929);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(138, 20, 20, 0.4);
        }

        #signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(194, 41, 41, 0.5);
        }

        #login {
            background: linear-gradient(135deg, #d4a017, #b38209);
            color: #1a1100;
            box-shadow: 0 4px 12px rgba(212, 160, 23, 0.3);
        }

        #login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(212, 160, 23, 0.5);
        }

        #msg {
            margin-top: 18px;
            font-size: 13.5px;
            font-weight: 600;
            min-height: 20px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="back-nav">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Kolhapur Kult
        </a>
    </div>

    <div class="container">
        <div class="brand-icon">KK</div>
        <h2>Kolhapur Kult</h2>
        <p class="tagline">Join our traveler community or sign in</p>

        <form>
            <div class="input-group">
                <label for="user">Username / Email</label>
                <input type="text" id="user" placeholder="Enter username" autocomplete="username">
            </div>

            <div class="input-group">
                <label for="pass">Password</label>
                <input type="password" id="pass" placeholder="Enter password" autocomplete="current-password">
            </div>

            <div class="btn-row">
                <button type="button" id="signup">Sign Up</button>
                <button type="button" id="login">Login</button>
            </div>

            <p id="msg"></p>
        </form>
    </div>

    <script src="form.js"></script>
</body>
</html>
